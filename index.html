<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>College Event Management</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>
<body>
  <!-- Floating Leaves Container -->
  <div class="leaves-container" id="leavesContainer" aria-hidden="true"></div>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="nav-brand">
      <i class="fas fa-leaf"></i>
      <span>CollegeEvents</span>
    </div>
    <ul class="nav-links" id="navLinks">
      <li><a href="#" data-page="home" class="active">Home</a></li>
      <li><a href="#" data-page="about">About</a></li>
      <li><a href="#" data-page="events">Events</a></li>
      <li><a href="#" data-page="manage">Manage</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
      <i class="fas fa-bars"></i>
    </button>
  </nav>

  <!-- Main Content -->
  <main id="app"></main>

  <!-- Toast Container -->
  <div id="toastContainer"></div>

  <!-- Event Modal -->
  <div class="modal-overlay" id="eventModal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add New Event</h2>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <form id="eventForm">
        <input type="hidden" id="eventId" />
        <div class="form-group">
          <label for="eventTitle">Event Title *</label>
          <input type="text" id="eventTitle" required placeholder="e.g. Tech Fest 2026" />
        </div>
        <div class="form-group">
          <label for="eventDescription">Description *</label>
          <textarea id="eventDescription" rows="4" required placeholder="Describe the event..."></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="eventDate">Date *</label>
            <input type="date" id="eventDate" required />
          </div>
          <div class="form-group">
            <label for="eventTime">Time *</label>
            <input type="time" id="eventTime" required />
          </div>
        </div>
        <div class="form-group">
          <label for="eventVenue">Venue *</label>
          <input type="text" id="eventVenue" required placeholder="e.g. Main Auditorium" />
        </div>
        <div class="form-group">
          <label for="eventCategory">Category *</label>
          <select id="eventCategory" required>
            <option value="">Select category</option>
            <option value="Technical">Technical</option>
            <option value="Cultural">Cultural</option>
            <option value="Sports">Sports</option>
            <option value="Workshop">Workshop</option>
            <option value="Seminar">Seminar</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Event</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Confirm Delete Modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Confirm Delete</h2>
        <button class="modal-close" id="confirmClose">&times;</button>
      </div>
      <p id="confirmMessage">Are you sure you want to delete this event?</p>
      <div class="form-actions">
        <button type="button" class="btn btn-secondary" id="confirmCancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/events.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
